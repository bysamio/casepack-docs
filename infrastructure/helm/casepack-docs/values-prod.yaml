# Production values for casepack-docs

replicaCount: 1

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: docs.casepack.app
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: casepack-docs-prod-tls
      hosts:
        - docs.casepack.app

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75

resources:
  requests:
    cpu: 50m
    memory: 16Mi
  limits:
    cpu: 200m
    memory: 64Mi

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        type: string
      next_bump:
        description: "Version bump to apply on main after the release tag"
        required: true
        type: choice
        default: minor
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Bump, Tag & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # main is a protected branch (PR + review required). The default
          # GITHUB_TOKEN authenticates as github-actions[bot], which is NOT
          # exempt and gets rejected. RELEASE_TOKEN is a fine-grained PAT owned
          # by bysamio (a repo admin), who IS exempt via enforce_admins:false —
          # so the direct pushes to main below succeed. actions/checkout also
          # persists this token for the subsequent `git push` calls.
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull --rebase origin main

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Validate release version and calculate next snapshot
        id: versions
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          NEXT_BUMP="${{ inputs.next_bump }}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be a plain SemVer version like 0.1.0" >&2
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "$NEXT_BUMP" in
            patch)
              NEXT_DEV="${MAJOR}.${MINOR}.$((PATCH + 1))-dev"
              ;;
            minor)
              NEXT_DEV="${MAJOR}.$((MINOR + 1)).0-dev"
              ;;
            major)
              NEXT_DEV="$((MAJOR + 1)).0.0-dev"
              ;;
            *)
              echo "Unsupported next_bump: $NEXT_BUMP" >&2
              exit 1
              ;;
          esac

          echo "release_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "next_dev=$NEXT_DEV" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"
          echo "Next dev version: $NEXT_DEV"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit release version bump
        run: |
          npm version ${{ steps.versions.outputs.release_version }} --no-git-tag-version --allow-same-version
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore: release v${{ steps.versions.outputs.release_version }}"
          git push

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "v${{ steps.versions.outputs.release_version }}"
          git push origin "v${{ steps.versions.outputs.release_version }}"
          gh release create "v${{ steps.versions.outputs.release_version }}" \
            --title "v${{ steps.versions.outputs.release_version }}" \
            --generate-notes

      - name: Trigger release image build
        # build-publish.yml filters its push trigger by `paths`, which makes
        # tag-push auto-triggering unreliable (a tag push commonly reports no
        # changed files and is skipped). Dispatch it explicitly so the release
        # image always builds. workflow_dispatch via GITHUB_TOKEN IS allowed to
        # start a new run — unlike push/tag events created by GITHUB_TOKEN.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-publish.yml \
            --ref "v${{ steps.versions.outputs.release_version }}" \
            -f version="${{ steps.versions.outputs.release_version }}"
          echo "Triggered release CI/CD pipeline for v${{ steps.versions.outputs.release_version }}"

      - name: Commit next dev version bump
        # This push to main is authenticated by RELEASE_TOKEN (a PAT), so — unlike
        # the old GITHUB_TOKEN flow — it DOES auto-trigger build-publish.yml via
        # its `branches: [main]` + package.json path filter. No explicit dispatch
        # for the main build is needed; any interim build from the release commit
        # above is superseded by this one through build-publish's concurrency group.
        run: |
          npm version ${{ steps.versions.outputs.next_dev }} --no-git-tag-version --allow-same-version
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore: start ${{ steps.versions.outputs.next_dev }}"
          git push

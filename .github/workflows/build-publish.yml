name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "Dockerfile"
      - ".github/workflows/build-publish.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "Dockerfile"
      - ".github/workflows/build-publish.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag override (e.g. 0.1.0)"
        required: false
        type: string

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bysamio/casepack-docs

jobs:
  # ─── Stage 1: Build & Type-check ────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx astro check

      - name: Build site
        run: npm run build

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ─── Stage 2: Build & Publish Docker Image ─────────────────────
  build-and-push:
    name: Build & Publish
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short=7 HEAD)

          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${PKG_VERSION}-${SHORT_SHA}"
          fi

          IS_RELEASE=$([[ "${{ github.ref_type }}" == "tag" ]] && echo "true" || echo "false")

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (package.json: $PKG_VERSION, release: $IS_RELEASE)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ─── Stage 3: Propose Helm Chart Update ───────────────────────
  propose-chart-update:
    name: Propose Helm Chart Update
    needs: build-and-push
    if: needs.build-and-push.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout charts repository
        uses: actions/checkout@v5
        with:
          repository: bysamio/charts
          token: ${{ secrets.CHARTS_REPO_TOKEN }}
          path: charts

      - name: Update chart metadata
        working-directory: charts
        run: |
          set -euo pipefail
          VERSION="${{ needs.build-and-push.outputs.version }}"
          CHART_DIR="casepack-docs"

          sed -i "s/^version:.*/version: ${VERSION}/" "${CHART_DIR}/Chart.yaml"
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" "${CHART_DIR}/Chart.yaml"

          grep -E '^(version|appVersion):' "${CHART_DIR}/Chart.yaml"

      - name: Open charts pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.CHARTS_REPO_TOKEN }}
          path: charts
          branch: automation/casepack-docs-${{ needs.build-and-push.outputs.version }}
          base: main
          delete-branch: true
          commit-message: "chore(casepack-docs): update chart to ${{ needs.build-and-push.outputs.version }}"
          title: "chore(casepack-docs): update chart to ${{ needs.build-and-push.outputs.version }}"
          body: |
            Updates the `casepack-docs` Helm chart for image `ghcr.io/bysamio/casepack-docs:${{ needs.build-and-push.outputs.version }}`.

            This PR was opened automatically after the release image was published.
          labels: |
            automated
            helm
            casepack-docs

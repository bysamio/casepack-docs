<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 32" fill="none">
  <!-- Icon: 3 stacked document cards -->
  <g>
    <!-- Back card -->
    <rect x="6" y="2" width="18" height="22" rx="2.5" fill="#e2e5ea" stroke="#1e2330" stroke-width="1.5" opacity="0.35"/>
    <!-- Middle card -->
    <rect x="3" y="5" width="18" height="22" rx="2.5" fill="#e2e5ea" stroke="#1e2330" stroke-width="1.5" opacity="0.6"/>
    <!-- Front card -->
    <rect x="0" y="8" width="18" height="22" rx="2.5" fill="#fcfcfd" stroke="#1e2330" stroke-width="1.5"/>
    <!-- Corner fold accent -->
    <path d="M12 8 L18 8 L18 14 Z" fill="#2563eb" opacity="0.9"/>
    <!-- Document lines -->
    <line x1="4" y1="18" x2="13" y2="18" stroke="#1e2330" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="4" y1="22" x2="11" y2="22" stroke="#8b92a0" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="4" y1="26" x2="9" y2="26" stroke="#8b92a0" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="28" y="24" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="600" fill="#1e2330" letter-spacing="-0.03em">
    Case<tspan font-weight="700">Pack</tspan>
  </text>
  <text x="113" y="24" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="400" fill="#8b92a0" letter-spacing="-0.01em">
    Docs
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 32" fill="none">
  <!-- Icon: 3 stacked document cards (dark mode) -->
  <g>
    <!-- Back card -->
    <rect x="6" y="2" width="18" height="22" rx="2.5" fill="#2e3444" stroke="#f1f3f5" stroke-width="1.5" opacity="0.35"/>
    <!-- Middle card -->
    <rect x="3" y="5" width="18" height="22" rx="2.5" fill="#2e3444" stroke="#f1f3f5" stroke-width="1.5" opacity="0.6"/>
    <!-- Front card -->
    <rect x="0" y="8" width="18" height="22" rx="2.5" fill="#1a1f2e" stroke="#f1f3f5" stroke-width="1.5"/>
    <!-- Corner fold accent -->
    <path d="M12 8 L18 8 L18 14 Z" fill="#3b82f6" opacity="0.9"/>
    <!-- Document lines -->
    <line x1="4" y1="18" x2="13" y2="18" stroke="#f1f3f5" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="4" y1="22" x2="11" y2="22" stroke="#8b92a0" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="4" y1="26" x2="9" y2="26" stroke="#8b92a0" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="28" y="24" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="600" fill="#f1f3f5" letter-spacing="-0.03em">
    Case<tspan font-weight="700">Pack</tspan>
  </text>
  <text x="113" y="24" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="400" fill="#8b92a0" letter-spacing="-0.01em">
    Docs
  </text>
</svg>
